services:
  api:
    build: .
    container_name: reporag-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: reporag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: